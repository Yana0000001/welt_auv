services:
  welt_auv_control:
    image: hydronautics/welt_auv:control
    container_name: s_welt_auv_control
    ipc: host
    network_mode: host
    command: ros2 launch welt_launch control.launch.py
    restart: unless-stopped
    volumes:
      - ${HOME}/welt:/welt


  welt_auv_od:
    image: hydronautics/welt_auv:od
    container_name: s_welt_auv_od
    ipc: host
    platform: linux/arm64
    runtime: nvidia
    gpus: all
    command: ros2 launch welt_launch od.launch.py
    restart: unless-stopped
    volumes:
      - ${HOME}/welt:/welt

  zed_ros2:
      image: hydronautics/zed_ros2:humble-l4t-r36.3.0-s4.2.5
      container_name: s_zed_ros2
      # image: hydronautics/zed_ros2:humble-l4t-r36.3.0-s4.2.5-neural # for neural
      # container_name: s_zed_ros2_neural # for neural
      ipc: host
      runtime: nvidia
      gpus: all
      privileged: true
      volumes:
        - /dev:/dev
        - /dev/shm:/dev/shm
        - /usr/local/zed/resources:/usr/local/zed/resources
        - /usr/local/zed/settings:/usr/local/zed/settings
      command: ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zedm

  rviz2:
    image: husarion/rviz2:humble-11.2.11-20240320
    container_name: s_rviz2
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    profiles:
      - debug
      - visualize

  recorder:
    image: ros:humble-ros-base
    container_name: s_recorder
    ipc: host
    network_mode: host
    init: true # Гарантирует корректный проброс SIGINT/SIGTERM для предотвращения порчи bag-файла
    volumes:
      - ${HOME}/rosbags:/rosbags
    # Запись минимального набора топиков, разбиение файлов по 500 МБ и контроль свободного места
    command: >
      bash -c '
      mkdir -p /rosbags/$(date +%Y-%m-%d_%H-%M-%S) && 
      ros2 bag record 
      -o /rosbags/$(date +%Y-%m-%d_%H-%M-%S)/session 
      --compression-mode file 
      --compression-format zstd 
      --max-bag-size 524288000 
      /stingray/topics/camera/front 
      /stingray/topics/camera/front/camera_info 
      /stingray/topics/camera/bottom 
      /stingray/topics/camera/bottom/camera_info
      /tf
      /tf_static'
    profiles:
      - debug
      - vision
    restart: no

  usb_cameras:
    image: ros:humble-ros-base
    container_name: s_usb_cameras
    ipc: host
    network_mode: host
    privileged: true
    volumes:
      - /dev/v4l/by-path/platform-3610000.usb-usb-0:2.4:1.0-video-index0:/dev/v4l/by-path/platform-3610000.usb-usb-0:2.4:1.0-video-index0
      - /dev/v4l/by-id/usb-Microsoft_Microsoft®_LifeCam_HD-3000-video-index0:/dev/v4l/by-id/usb-Microsoft_Microsoft®_LifeCam_HD-3000-video-index0
      - ${HOME}/welt:/welt
    command: ros2 launch welt_launch cam.launch.py enable_front_camera:=true enable_bottom_camera:=true
    profiles:
      - vision
    restart: unless-stopped

